# Unified Infrastructure Inventory

# Cloud Servers (halvarm)
servers:
  hosts:
    halvarm:
      ansible_user: ubuntu
      # ansible_host inherited from ~/.ssh/config alias 'halvarm'
      public_ip: 100.73.45.27

      # Federation Config
      nomad_region: cloud
      nomad_datacenter: oci-eu
      node_class: cloud
      nomad_role: server

      # Peer to join via WAN (Tailscale) - Only if peer exists
      # wan_peer: 100.92.153.10

# Local Machine (ntb)
local:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3

      # Federation Config
      nomad_region: local
      nomad_datacenter: laptop
      node_class: local
      nomad_role: server

# Remote Workstations
workstations:
  hosts:
    ntb:
      ansible_connection: local
    wtw.a:
      ansible_host: 100.72.49.46
      ansible_user: simon
      ansible_connection: ssh
      ansible_shell_type: powershell
      ansible_become: false

# reMarkable tablet (connected via USB)
remarkable:
  hosts:
    rm2:
      ansible_host: 10.11.99.1
      ansible_user: root
      ansible_connection: ssh
      ansible_shell_type: sh
      remarkable_ssh_port: 22
