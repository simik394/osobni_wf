---
- name: Ensure YOLO plugin directory exists
  file:
    path: "{{ ansible_env.HOME }}/Obsi/.obsidian/plugins/yolo"
    state: directory
    mode: "0755"

- name: Deploy YOLO plugin configuration
  template:
    src: yolo_data.json.j2
    dest: "{{ ansible_env.HOME }}/Obsi/.obsidian/plugins/yolo/data.json"
    mode: "0644"
