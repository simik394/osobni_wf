---
- name: Check if Vial is already installed
  command: command -v vial
  register: vial_check
  failed_when: false
  changed_when: false

- name: Run Vial installation script
  ansible.builtin.command:
    cmd: "/home/sim/Obsi/Prods/01-pwf/infrastruct/install/install.vial.sh"
  register: vial_install_output
  become: true
  when: vial_check.rc != 0
  changed_when: vial_install_output.stdout is defined and 'Vial installed successfully!' in vial_install_output.stdout