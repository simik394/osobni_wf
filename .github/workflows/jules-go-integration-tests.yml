name: Jules Go Integration Tests

on:
    push:
        branches:
            - main
        paths:
            - "agents/jules-go/**"
    pull_request:
        paths:
            - "agents/jules-go/**"

jobs:
    integration-test:
        runs-on: ubuntu-latest
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              env:
                  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

            - name: Start FalkorDB
              run: |
                  docker run -d --name falkordb -p 6379:6379 falkordb/falkordb:latest
                  sleep 3

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.21"

            - name: Run tests
              run: |
                  cd agents/jules-go
                  go test ./...
