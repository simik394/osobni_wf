  labelCheckbox: 'div[role="menuitemcheckbox"]'
  
  # Sidebar navigation labels
  sidebarLabelItem: 'div[role="navigation"] a[href*="label/"]'
# ============================================================
# AI MODE (Google Search AI) SELECTORS
# ============================================================
aiMode:
  # Entry point
  entryUrl: "https://www.google.com/search?udm=50"
  myActivityUrl: "https://myactivity.google.com/myactivity?product=83"

  # ---------------------------------------------------------------------------
  # Sidebar history (in-app dialog)
  # ---------------------------------------------------------------------------
  sidebar:
    # The sidebar is a role="dialog" with a stable aria-label
    dialog: 'div[role="dialog"][aria-label*="AI Mode" i], div[role="dialog"][aria-label*="Režim AI" i], div[role="dialog"][aria-label*="history" i]'
    # Trigger button uses aria-label (multi-lang fallback)
    trigger: 'button[aria-label*="AI Mode history" i], button[aria-label*="Historie" i], button[aria-label*="history" i]'
    # History items are identifiable by structure: buttons inside the dialog
    historyItem: 'div[role="dialog"] button'
    showMore: 'button:has-text("Show more"), button:has-text("Zobrazit více"), button:has-text("Mehr anzeigen")'
    mySearchHistory: 'a[href*="myactivity.google.com"]'

  # ---------------------------------------------------------------------------
  # My Activity page (product=83) — robust aria + href selectors
  # ---------------------------------------------------------------------------
  myActivity:
    # Activity items: links to AI Mode results (contain udm=50 && mstk in href)
    # Each has aria-label like "{query text} (opens in new tab)"
    activityItem: 'a[href*="udm=50"][href*="mstk="]'
    # Fallback: any link matching AI Mode URL pattern
    activityItemFallback: 'a[href*="udm=50"]'
    # Details button uses aria-label pattern
    detailsButton: 'a[role="button"][aria-label*="podrobnosti" i], a[role="button"][aria-label*="Details" i], a[role="button"][aria-label*="detail" i]'
    # Delete uses aria-label with activity item reference
    deleteButton: 'button[aria-label*="Smazat položku" i], button[aria-label*="Delete activity" i], button[aria-label*="Delete item" i]'
    # Day section delete
    deleteDayButton: 'button[aria-label*="Smazat veškerou aktivitu" i], button[aria-label*="Delete all" i]'

  # ---------------------------------------------------------------------------
  # Conversation view (udm=50 results page)
  # All selectors use stable data-*, jsname, role, aria, or semantic HTML.
  # Zero minified CSS class names.
  # Verified 2026-04-05 on halvarm, Chrome 145.
  # ---------------------------------------------------------------------------
  conversation:
    # -- AI Response container --
    # data-xid="aim-mars-turn-root" is a semantic, stable attribute from Google's
    # Angular/Lit framework, unlikely to change with CSS refactors.
    aiResponse: 'div[data-xid="aim-mars-turn-root"]'
    # Fallback: streaming wrapper (innermost content container)
    aiResponseFallback: 'div[data-streaming-container]'
    # Outer turn wrapper with jsname stable identifiers
    turnContainer: 'div[jsname="coFSxe"]'
    turnRoot: 'div[jsname="H7tCnf"]'
    # Main content area (Google standard — id is stable, role may not coexist)
    mainContent: '#center_col, div[role="main"]'

    # -- User query --
    # The query bar may be a search box or a rendered text span
    userQuery: "input[name='q'], textarea[name='q'], textarea[aria-label*='Search' i], textarea[aria-label*='Hledat' i]"

    # -- Code blocks --
    # Semantic HTML — the most stable selector possible
    codeBlock: "pre"
    inlineCode: "code"

    # -- Sources & citations --
    # Citation chip buttons have aria-label with source name pattern
    # e.g. aria-label="Stack Overflow +2" or similar
    citationChip: 'button[aria-label*="+"]'
    # Text links inside the response use standard <a> with external href
    textLink: 'div[data-xid="aim-mars-turn-root"] a[href^="http"]:not([href*="google.com"])'
    textLinkFallback: 'div[data-streaming-container] a[href^="http"]:not([href*="google.com"])'
    # Source cards: links opening to external sites in the sidebar panel
    # Identified by being external links inside the source panel area
    sourceCard: 'a[href^="http"]:not([href*="google.com"]):not([role]):not([aria-label])'
    # Source panel: contains "N sites" counter text
    sourcePanel: 'div[role="complementary"], aside'

    # -- Follow-up input --
    # placeholder="Ask anything" is the most stable attribute here
    followUpInput: "textarea[placeholder*='Ask' i], textarea[placeholder*='Zeptejte' i], textarea[placeholder*='Frag' i]"

    # -- Action buttons (aria-labels are stable, text varies by locale) --
    copyButton: 'button[aria-label*="Copy" i], button[aria-label*="Kopír" i], button[aria-label*="Kopie" i]'
    shareButton: 'button[aria-label*="Share" i], button[aria-label*="Sdíl" i]'
    feedbackGood: 'button[aria-label*="Good" i], button[aria-label*="Dobr" i]'
    feedbackBad: 'button[aria-label*="Bad" i], button[aria-label*="Špatn" i]'
    # "AI responses may include mistakes" disclaimer link
    disclaimer: 'a[href*="support.google.com/websearch"]'

  # ---------------------------------------------------------------------------
  # Auth/consent
  # ---------------------------------------------------------------------------
  auth:
    acceptAll: 'button:has-text("Accept all"), button:has-text("Přijmout vše"), button:has-text("Souhlasím"), button:has-text("Alle akzeptieren")'

  # ---------------------------------------------------------------------------
  # Model Switcher
  # ---------------------------------------------------------------------------
  model:
    trigger: 'div.CcNe6e[role="button"], [role="button"]:has-text("AI Mode"), [role="button"]:has-text("Režim AI")'
    autoOption: 'button[aria-label="Auto"], button[role="menuitemradio"]:has-text("Auto")'
    proOption: 'button[aria-label="Pro"], button[role="menuitemradio"]:has-text("Pro")'

  # ---------------------------------------------------------------------------
  # Uploading
  # ---------------------------------------------------------------------------
  upload:
    plusButton: 'button[aria-label*="plus" i], button:has(svg), button.nQpXxb'
    imageOption: 'button[aria-label="Upload image"]'
    fileOption: 'button[aria-label="Upload file"]'

# ============================================================
# PERPLEXITY SELECTORS
# ============================================================
perplexity:
  queryInput: ["textarea[placeholder*='Ask']", "div[contenteditable='true']"]
  followUpInput: 'textarea[placeholder*="follow-up"]'
  answerContainer: "div.prose, .answer-content, [class*='answer-']"
# ============================================================
# GOOGLE AUTHENTICATION
# ============================================================
googleAuth:
  accountChooser:
    container: 'div[jsname="tJHJj"], #accountchooser, h1:has-text("Choose an account"), h1:has-text("Zvolte účet")'
    accountItem: 'div[data-identifier], div[jsname="PaL3lc"], [data-accountindex], li[role="option"]'
    useAnotherAccount: 'div[jsname="vS779c"], #accountchooser-add-account, [data-item-index="another"]'
  login:
    identifier: 'input[type="email"], input[name="identifier"]'
    password: 'input[type="password"], input[name="password"]'
    nextButton: '#identifierNext, #passwordNext'
