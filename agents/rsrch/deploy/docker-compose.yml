version: "3.8"

services:
  rsrch:
    build:
      context: ../../
      dockerfile: rsrch/deploy/Dockerfile
    image: rsrch:latest
    container_name: rsrch
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "5902:5900" # VNC (Singleton mode)
      - "9225:9223" # CDP port (Singleton mode)
    volumes:
      - ../data:/app/data
      - ../src:/app/src
      # - ./dist:/app/dist
      - ${HOME}/.config/rsrch:/app/config
      - ${HOME}/.rsrch/profiles:/app/profiles
    environment:
      - PORT=${PORT:-3000}
      - WINDMILL_TOKEN=${WINDMILL_TOKEN}
      - BROWSER_CDP_ENDPOINT=http://localhost:9223
      - PERPLEXITY_USER_DATA_DIR=/app/config/user-data
      - AUTH_FILE=/app/config/auth.json
      - PROFILES_DIR=/app/profiles
      - FALKORDB_HOST=falkordb
    depends_on:
      - falkordb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ipc: host
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "6379:6379"
    volumes:
      - ./data/falkordb:/data
    restart: unless-stopped
