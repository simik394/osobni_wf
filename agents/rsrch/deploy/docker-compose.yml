version: "3.8"

services:
  # Principal Logic Node (Express App)
  rsrch-server:
    build:
      context: ../../
      dockerfile: agents/rsrch/deploy/Dockerfile.server
    image: rsrch-server:latest
    container_name: rsrch-server
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - WINDMILL_TOKEN=${WINDMILL_TOKEN}
      - BROWSER_CDP_ENDPOINT=http://rsrch-browser:9223
      - PERPLEXITY_USER_DATA_DIR=/app/config/user-data
      - AUTH_FILE=/app/config/auth.json
      - PROFILES_DIR=/app/profiles
      - FALKORDB_HOST=falkordb
    depends_on:
      - falkordb
      - rsrch-browser
    volumes:
      - ../data:/app/data
      - ${HOME}/.config/rsrch:/app/config
    restart: unless-stopped

  # Sidecar Browser Instance (VNC + Playwright)
  rsrch-browser:
    build:
      context: ../../
      dockerfile: agents/rsrch/deploy/Dockerfile.browser
    image: rsrch-browser:latest
    container_name: rsrch-browser
    ports:
      - "5902:5900" # VNC
      - "9225:9223" # CDP port
    volumes:
      - ${HOME}/.rsrch/profiles:/app/profiles
    ipc: host
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "6379:6379"
    volumes:
      - ./data/falkordb:/data
    restart: unless-stopped
